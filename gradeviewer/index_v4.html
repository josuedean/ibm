<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade Viewer v3</title>

<style>
:root{--font-main:'Inter',system-ui,sans-serif;--radius:14px;--speed:260ms}
[data-theme=light]{--bg:#f8fafc;--surface:#fff;--surface-soft:#eef6fb;--text:#0f172a;--muted:#475569;--accent:#06b6d4;--accent-soft:#a5f3fc;--line:#d7e4ea;--shadow:0 12px 32px rgba(15,23,42,.14);--score-bg:#ecfeff}
[data-theme=dark]{--bg:#07111f;--surface:#111c2e;--surface-soft:#16243a;--text:#e2e8f0;--muted:#9fb0c4;--accent:#22d3ee;--accent-soft:#0e7490;--line:#26384f;--shadow:0 18px 42px rgba(0,0,0,.34);--score-bg:#0b3143}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-main);background:radial-gradient(circle at top,var(--surface-soft),var(--bg) 45rem);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;transition:background var(--speed),color var(--speed)}
.card{width:min(100%,42rem);background:var(--surface);padding:2rem 2.5rem;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
h1,h2,h3{margin-bottom:.75rem;font-weight:650}h1{font-size:1.75rem;text-align:center;color:var(--accent)}h2{font-size:1.55rem}
h3{font-size:1.08rem;margin-top:1.2rem;border-bottom:1px solid var(--accent-soft);padding-bottom:.25rem}
label{display:block;margin:.9rem 0 .25rem;font-weight:500}
input,select,button{width:100%;padding:.55rem .8rem;font-size:1rem;border-radius:var(--radius);border:2px solid var(--accent-soft);background:var(--bg);color:var(--text);transition:border var(--speed),background var(--speed),color var(--speed)}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{cursor:pointer;margin-top:1rem;background:var(--accent);color:#04212b;border:none;font-weight:650}
button:hover{background:var(--text);color:var(--bg)}
.error{color:#fb7185;margin-top:.7rem;text-align:center}
hr{border:none;border-top:1px solid var(--line);margin:1.25rem 0}
/* list layout */
ul{list-style:none;margin-top:.4rem;padding-left:0}
ul.grade-list{list-style:none;margin:.55rem 0 .9rem;padding-left:1.15rem;padding-right:.7rem}
.grade-list li.grade-item{display:grid;grid-template-columns:8rem 1.4rem minmax(0,1fr);column-gap:.45rem;align-items:center;margin:.38rem 0;color:var(--muted)}
.grade-score{justify-self:center;text-align:center;width:7.7rem;font-weight:700;color:var(--accent);white-space:nowrap;min-width:0}
.grade-arrow{color:var(--muted);opacity:.7;text-align:center;font-weight:700}
.grade-label{min-width:0;line-height:1.35}
.status-pill,.score-token{display:inline-flex;align-items:center;justify-content:center;min-width:7.6rem;text-align:center;padding:.2rem .58rem;border-radius:999px;font-size:.88rem;line-height:1.35;font-weight:800;letter-spacing:.01em;position:relative;overflow:hidden;box-shadow:none;text-shadow:none}
.status-complete{background:#14532d;color:#4ade80;border:2px solid #22c55e}
.status-incomplete{background:linear-gradient(90deg,#0c4a6e 0 25%,transparent 25% 100%);color:#38bdf8;border:2px solid #38bdf8}
.status-unattempted{background:transparent;color:#fb7185;border:2px solid #ef4444}
.score-token{background:linear-gradient(90deg,#164e63 0 80%,transparent 80% 100%);color:#67e8f9;border:2px solid #0e7490}
.account-actions{display:flex;justify-content:flex-end;margin-bottom:.45rem}
.password-link{width:auto;margin:0;padding:.2rem .15rem;background:transparent;color:var(--muted);border:none;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.password-link:hover{background:transparent;color:var(--accent)}
/* theme toggle */
.theme-toggle{position:fixed;top:1rem;right:1rem;display:flex;gap:.45rem;z-index:20}
.theme-toggle-btn{width:auto;margin:0;padding:.45rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.theme-toggle-btn:hover{background:var(--surface-soft);color:var(--accent)}
/* grade header */
.letter-big{font-size:2.4rem;font-weight:750;margin-left:.6rem;vertical-align:middle}
.current-line{margin:.25rem 0 1rem}
/* dashboard */
.summary-dashboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.65rem;margin:1rem 0 1.15rem}
.summary-card{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:.75rem .7rem;text-align:center;min-height:5.2rem;display:flex;flex-direction:column;justify-content:center;align-items:center}
.summary-label{font-size:.78rem;color:var(--muted);margin-bottom:.18rem}
.summary-main{font-size:1.45rem;font-weight:800;color:var(--text);line-height:1.1}
.summary-sub{font-size:.78rem;color:var(--muted);margin-top:.18rem}
.summary-card.complete{border-color:#2fb34455}.summary-card.incomplete{border-color:#38bdf866}.summary-card.unattempted{border-color:#9b111e88}.summary-card.absences{border-color:var(--accent-soft)}
.summary-card.complete .summary-main{color:#2fb344}.summary-card.incomplete .summary-main{color:#38bdf8}.summary-card.unattempted .summary-main{color:#ff5b6d}.summary-card.absences .summary-main{color:var(--accent)}
/* collapsible sections */
.grade-section{margin-top:.9rem;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,var(--surface-soft));overflow:hidden}
.grade-section summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem .95rem;font-weight:700;color:var(--text);list-style:none}
.grade-section summary::-webkit-details-marker{display:none}
.grade-section summary::after{content:'▸';color:var(--accent);font-size:.95rem;transition:transform var(--speed)}
.grade-section[open] summary{border-bottom:1px solid var(--line)}
.grade-section[open] summary::after{content:'▾'}
.section-count{margin-left:auto;margin-right:.4rem;color:var(--muted);font-size:.78rem;font-weight:600;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;padding:.08rem .45rem}
/* attendance */
.absence-dates{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 1rem 1rem;padding-left:1.15rem}
.absence-chip{display:inline-block;padding:.25rem .55rem;border-radius:999px;background:var(--accent-soft);color:var(--text);font-size:.92rem}
.attendance-note{margin:.55rem 1rem 1rem;padding-left:1.15rem;color:var(--muted);font-size:.95rem}
@media (max-width:760px){.summary-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){body{padding:1rem}.card{padding:1.35rem}.summary-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grade-list li.grade-item{grid-template-columns:7.2rem 1.1rem minmax(0,1fr)}.grade-score{width:7rem}.status-pill,.score-token{min-width:6.9rem;font-size:.82rem}}

</style>
</head>

<body>

<!-- theme switcher -->
<div class="theme-toggle">
 <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Switch to light mode">☀ Light mode</button>
</div>

<!-- LOGIN -->
<section id="login" class="card">
 <h1>Grade Viewer</h1>
 <form id="frm">
 <label>Class
 <select id="cls" required>
 <option value="" disabled selected>Choose…</option>
 <option>Logistics</option>
 <option>Trade</option>
 <option>Management Science</option>
 </select>
 </label>
 <label>Student ID <input id="sid" required></label>
 <label>Password   <input id="pw" type="password" required></label>
 <button type="submit">View Grades</button>
 </form>
 <p id="err" class="error"></p>
</section>

<!-- GRADES -->
<section id="grades" class="card" style="display:none;"></section>

<!-- PW dialog + overlay (unchanged) -->
<section id="pwCard" class="card" style="display:none;position:fixed;inset:0;margin:auto;max-width:26rem;z-index:50">
 <h2>Change Password</h2>
 <form id="pwForm">
 <label>Current Password <input id="oldPw" type="password" required></label>
 <label>New Password     <input id="newPw" type="password" required></label>
 <label>Confirm New      <input id="newPw2" type="password" required></label>
 <button type="submit">Save</button>
 <button type="button" id="cancelPw" style="margin-top:.5rem;background:var(--surface);color:var(--text)">Cancel</button>
 </form>
 <p id="pwMsg" class="error"></p>
</section>
<div id="overlay" style="display:none;position:fixed;inset:0;background:#0008;backdrop-filter:blur(2px)"></div>

<script>
const GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbwVhAYnKmB3q7yOTrM8wx3WeXwdj22WPr1bRcHmZG-O7vZYDZ70CXtDw-O-DY2dSVnlXQ/exec';
const $=id=>document.getElementById(id);

/* theme switch */
const THEME_KEY = 'grade-viewer-theme';
function applyTheme(theme){
  const safeTheme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', safeTheme);
  const btn = $('themeToggle');
  if (btn) {
    btn.textContent = safeTheme === 'dark' ? '☀ Light mode' : '🌙 Dark mode';
    btn.setAttribute('aria-label', safeTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
$('themeToggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

/* grade helpers (no minus grades) */
const LADDER=["A+","A","B+","B","C+","C","D+","D","F"];
function letterFromPercent(p){
  if(p>=95)return"A+";if(p>=90)return"A";if(p>=85)return"B+";if(p>=80)return"B";
  if(p>=75)return"C+";if(p>=70)return"C";if(p>=65)return"D+";if(p>=60)return"D";return"F";}
function gradeColour(l){if(l==="F")return"#000";
  const i=LADDER.indexOf(l);const hue=220-i*(220/(LADDER.length-2));return`hsl(${hue},80%,55%)`;}
/*function pointsToNext(p){const r=(100-Math.floor(p))%5;return r===0?0:r;}*/
function escapeHtml(v){return String(v ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function hasValue(v){return v !== undefined && v !== null && String(v).trim() !== '';}
function hasCompletionTotals(t){return t && (hasValue(t.complete) || hasValue(t.incomplete) || hasValue(t.unattempted));}
function categoryDisplayName(cat){
  const key = String(cat ?? '').trim().toLowerCase();
  if (key === 'assignments') return 'LMS Assignments';
  if (key === 'activities' || key === 'activites') return 'Class Activities';
  if (key === 'quiz') return 'Quizzes';
  return cat;
}
function isEffortBasedCategory(cat){
  const key = String(cat ?? '').trim().toLowerCase();
  return key === 'assignments' || key === 'activities' || key === 'activites';
}
function statusClass(value){
  const status = String(value ?? '').trim().toLowerCase();
  if (status === 'complete') return 'status-complete';
  if (status === 'incomplete') return 'status-incomplete';
  if (status === 'unattempted') return 'status-unattempted';
  return '';
}
function renderScoreValue(cat, item){
  if (isEffortBasedCategory(cat)) {
    const score = item.score ?? '';
    const cls = statusClass(score);
    if (cls) return `<span class="status-pill ${cls}">${escapeHtml(score)}</span>`;
    return `<span class="score-token">${escapeHtml(score || '—')}</span>`;
  }
  return `<span class="score-token">${escapeHtml(item.score ?? 0)}/${escapeHtml(item.total ?? 0)}</span>`;
}
function completionNumber(t, key){
  return t && hasValue(t[key]) ? t[key] : '—';
}
function absenceCount(d){
  return Array.isArray(d.absenceDates) ? d.absenceDates.length : '—';
}
function renderDashboardCard(label, value, cls, sub=''){
  return `<div class="summary-card ${cls || ''}">
    <span class="summary-label">${escapeHtml(label)}</span>
    <span class="summary-main">${escapeHtml(value)}</span>
    ${sub ? `<span class="summary-sub">${escapeHtml(sub)}</span>` : ''}
  </div>`;
}
function renderSummaryDashboard(d, pct, letter){
  const t = d.completionTotals || {};
  return `<section class="summary-dashboard" aria-label="Grade summary">
    ${renderDashboardCard('Current Grade', letter, 'grade', `${pct.toFixed(1)}%`)}
    ${renderDashboardCard('Complete', completionNumber(t, 'complete'), 'complete')}
    ${renderDashboardCard('Incomplete', completionNumber(t, 'incomplete'), 'incomplete')}
    ${renderDashboardCard('Unattempted', completionNumber(t, 'unattempted'), 'unattempted')}
    ${renderDashboardCard('Absences', absenceCount(d), 'absences')}
  </section>`;
}
function shouldSectionStartOpen(cat, d){
  const display = String(categoryDisplayName(cat) ?? '').trim().toLowerCase();
  if (display === 'lms assignments' || display === 'class activities') return true;
  if (/^attendance$/i.test(String(cat)) && Array.isArray(d.absenceDates) && d.absenceDates.length > 0) return true;
  return false;
}

/* LOGIN */
$('frm').addEventListener('submit',async e=>{
  e.preventDefault();$('err').textContent='Checking…';
  const cls=$('cls').value,id=$('sid').value.trim(),pw=$('pw').value;
  try{
    const res=await fetch(`${GAS_ENDPOINT}?${new URLSearchParams({class:cls,id,pw,tab:'Totals'})}`);
    const js=await res.json();if(js.status!=='ok')throw new Error(js.message);
    window._login={cls,id,pw};render(js.data);
  }catch(err){$('err').textContent=err.message||err;}
});

/* RENDER */
function render(d){
  $('login').style.display = 'none';
  $('grades').style.display = 'block';

  const pct     = +d.currentPercent;
  const letter  = d.letterGrade || letterFromPercent(pct);
  /*
  const need    = pointsToNext(pct);
  const showMsg = letter !== 'A+' && need > 0;           // ⇦ NEW

  const nextLetter = showMsg ? letterFromPercent(pct + need) : '';

   ${showMsg ? `<p class="points-msg sparkle">
        Need <b>${need}</b> pt to reach <b>${nextLetter}</b>!
      </p>` : ''}
      
  <p><b>Current Points:</b> ${d.currentAvailablePoints.student}/${d.currentAvailablePoints.max}</p>
  <p><b>Max Possible Points:</b> ${d.maxPossiblePoints}</p>
  */
  const g = $('grades');
  g.innerHTML = `
    <div class="account-actions">
      <button id="openPw" class="password-link" type="button">Change Password</button>
    </div>

    <h2>Hello, ${escapeHtml(d.name || 'Student')}</h2>

    ${renderSummaryDashboard(d, pct, letter)}

    <hr>`;

  /* grade list */
  for (const [cat, items] of Object.entries(d.categories)) {
    const safeId = `ul-${cat}`.replace(/[^a-z0-9_-]/gi, '-');
    const isOpen = shouldSectionStartOpen(cat, d) ? ' open' : '';
    g.insertAdjacentHTML('beforeend', `
      <details class="grade-section"${isOpen}>
        <summary>
          <span>${escapeHtml(categoryDisplayName(cat))}</span>
          <span class="section-count">${items.length}</span>
        </summary>
        <ul id="${safeId}" class="grade-list"></ul>
      </details>`);
    const ul = $(safeId);
    items.forEach(o => ul.insertAdjacentHTML('beforeend',
      `<li class="grade-item">
        <span class="grade-score">${renderScoreValue(cat, o)}</span>
        <span class="grade-arrow">←</span>
        <span class="grade-label">${escapeHtml(o.label)}</span>
      </li>`));

    if (/^Attendance$/i.test(cat)) {
      renderAbsenceDates(ul.closest('details') || g, d.absenceDates, d.absenceDatesError);
    }
  }
  $('openPw').onclick = () => { $('overlay').style.display = $('pwCard').style.display = 'block'; };
 
  if (d.payload) {
  g.insertAdjacentHTML('beforeend', `
    <details class="grade-section payload-section">
      <summary><span>Payload</span></summary>
      <div style="padding:1rem 1.2rem;word-break:break-word">
        <p><a href="${escapeHtml(d.payload)}" target="_blank" rel="noopener noreferrer">${escapeHtml(d.payload)}</a></p>
      </div>
    </details>
  `);
  }
}


function renderAbsenceDates(container, dates, error) {
  if (error) {
    container.insertAdjacentHTML('beforeend',
      `<p class="attendance-note">Absence dates could not be loaded: ${escapeHtml(error)}</p>`);
    return;
  }

  if (!Array.isArray(dates) || dates.length === 0) {
    container.insertAdjacentHTML('beforeend',
      `<p class="attendance-note"><b>Absence Dates:</b> No recorded absences.</p>`);
    return;
  }

  container.insertAdjacentHTML('beforeend', `
    <p class="attendance-note"><b>Absence Dates:</b></p>
    <div class="absence-dates">
      ${dates.map(date => `<span class="absence-chip">${escapeHtml(date)}</span>`).join('')}
    </div>
  `);
}

/* PW change (unchanged) */
$('cancelPw').onclick=()=>{$('overlay').style.display=$('pwCard').style.display='none';$('pwMsg').textContent='';$('pwForm').reset();};
$('pwForm').addEventListener('submit',async e=>{
  e.preventDefault();const oldPw=$('oldPw').value,new1=$('newPw').value,new2=$('newPw2').value;
  if(new1!==new2){$('pwMsg').textContent='New passwords do not match.';return;}
  $('pwMsg').textContent='Updating…';
  const body=new URLSearchParams({action:'changePw',class:_login.cls,id:_login.id,oldPw,newPw:new1,tab:'Totals'});
  try{
    const r=await fetch(GAS_ENDPOINT,{method:'POST',body});const js=await r.json();
    if(js.status!=='ok')throw new Error(js.message);
    $('pwMsg').style.color='var(--accent)';$('pwMsg').textContent='Password updated!';_login.pw=new1;
    setTimeout(()=>$('cancelPw').click(),1200);
  }catch(err){$('pwMsg').style.color='#e11d48';$('pwMsg').textContent=err.message||err;}
});
</script>
</body>
</html>
