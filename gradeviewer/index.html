<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade Viewer</title>

<style>
:root{--font-main:'Inter',system-ui,sans-serif;--radius:14px;--speed:260ms}
[data-theme=light]{
  --bg:#f6f9fc;
  --page-bg:radial-gradient(circle at top,#e0f7ff 0,#f8fafc 46rem);
  --surface:#ffffff;
  --surface-soft:#edf7fb;
  --text:#0f172a;
  --muted:#52667a;
  --accent:#0891b2;
  --accent-soft:#bae6fd;
  --line:#cfdee8;
  --shadow:0 14px 34px rgba(15,23,42,.12);
  --input-bg:#ffffff;
  --input-border:#9bd5e8;
  --button-text:#ffffff;
  --pill-empty:#ffffff;
  --pill-blue-fill:#bae6fd;
  --pill-blue-text:#075985;
  --pill-blue-border:rgba(14,116,144,.45);
  --pill-orange-fill:#fed7aa;
  --pill-orange-text:#f97316;
  --pill-orange-border:rgba(194,65,12,.45);
  --pill-green-fill:#bbf7d0;
  --pill-green-text:#166534;
  --pill-green-border:rgba(22,101,52,.42);
  --pill-red-fill:#fecaca;
  --pill-red-text:#991b1b;
  --pill-red-border:rgba(153,27,27,.42);
}
[data-theme=dark]{
  --bg:#07111f;
  --page-bg:radial-gradient(circle at top,#16243a 0,#07111f 45rem);
  --surface:#111c2e;
  --surface-soft:#16243a;
  --text:#e2e8f0;
  --muted:#9fb0c4;
  --accent:#22d3ee;
  --accent-soft:#0e7490;
  --line:#26384f;
  --shadow:0 18px 42px rgba(0,0,0,.34);
  --input-bg:#07111f;
  --input-border:#1c5d72;
  --button-text:#04212b;
  --pill-empty:rgba(255,255,255,.045);
  --pill-blue-fill:#155e75;
  --pill-blue-text:#a5f3fc;
  --pill-blue-border:rgba(103,232,249,.42);
  --pill-orange-fill:#9a3412;
  --pill-orange-text:#f97316;
  --pill-orange-border:rgba(253,186,116,.42);
  --pill-green-fill:#166534;
  --pill-green-text:#bbf7d0;
  --pill-green-border:rgba(134,239,172,.42);
  --pill-red-fill:#7f1d1d;
  --pill-red-text:#fecaca;
  --pill-red-border:rgba(252,165,165,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-main);background:var(--page-bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;transition:background var(--speed),color var(--speed)}
.card{width:min(100%,42rem);background:var(--surface);padding:2rem 2.5rem;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
h1,h2,h3{margin-bottom:.75rem;font-weight:650}h1{font-size:1.75rem;text-align:center;color:var(--accent)}h2{font-size:1.55rem}
h3{font-size:1.08rem;margin-top:1.2rem;border-bottom:1px solid var(--accent-soft);padding-bottom:.25rem}
label{display:block;margin:.9rem 0 .25rem;font-weight:500}
input,select,button{width:100%;padding:.55rem .8rem;font-size:1rem;border-radius:var(--radius);border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);transition:border var(--speed),background var(--speed),color var(--speed)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button{cursor:pointer;margin-top:1rem;background:var(--accent);color:var(--button-text);border:none;font-weight:650}
button:hover{background:var(--text);color:var(--bg)}
.error{color:#fb7185;margin-top:.7rem;text-align:center}
hr{border:none;border-top:1px solid var(--line);margin:1.25rem 0}
/* list layout */
ul{list-style:none;margin-top:.4rem;padding-left:0}
ul.grade-list{list-style:none;margin:.55rem 0 .9rem;padding-left:1.15rem;padding-right:.7rem}
.grade-list li.grade-item{display:grid;grid-template-columns:8rem 1.4rem minmax(0,1fr);column-gap:.45rem;align-items:center;margin:.38rem 0;color:var(--muted)}
.grade-score{justify-self:center;text-align:center;width:7.7rem;font-weight:700;color:var(--accent);white-space:nowrap;min-width:0}
.grade-arrow{color:var(--muted);opacity:.7;text-align:center;font-weight:700}
.grade-label{min-width:0;line-height:1.35}
.status-pill,.score-token,.absence-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:7.6rem;
  text-align:center;
  padding:.2rem .58rem;
  border-radius:999px;
  font-size:.88rem;
  line-height:1.35;
  font-weight:800;
  letter-spacing:.01em;
  position:relative;
  overflow:hidden;
  box-shadow:none;
  text-shadow:none;
  border:1px solid var(--pill-border-color,var(--pill-blue-border));
  color:var(--pill-text-color,var(--pill-blue-text));
  background:linear-gradient(90deg,var(--pill-fill-color,var(--pill-blue-fill)) 0 var(--fill,0%),var(--pill-empty) var(--fill,0%) 100%);
}
.status-complete{--fill:100%;--pill-fill-color:var(--pill-green-fill);--pill-text-color:var(--pill-green-text);--pill-border-color:var(--pill-green-border)}
.status-effort{--fill:100%;--pill-fill-color:var(--pill-green-fill);--pill-text-color:var(--pill-green-text);--pill-border-color:var(--pill-green-border);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pill-green-fill) 82%,var(--pill-empty)) 0 6px,var(--pill-green-fill) 6px 12px)}
.status-incomplete{--fill:25%;--pill-fill-color:var(--pill-orange-fill);--pill-text-color:var(--pill-orange-text);--pill-border-color:var(--pill-orange-border)}
.status-unattempted{--fill:0%;--pill-fill-color:var(--pill-red-fill);--pill-text-color:var(--pill-red-text);--pill-border-color:var(--pill-red-border)}
.score-token{--pill-fill-color:var(--pill-blue-fill);--pill-text-color:var(--pill-blue-text);--pill-border-color:var(--pill-blue-border)}
.student-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.student-header h2{margin-bottom:0}
.password-link{width:auto;margin:0;padding:.2rem .15rem;background:transparent;color:var(--muted);border:none;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;font-weight:500;white-space:nowrap}
.password-link:hover{background:transparent;color:var(--accent)}
.grade-label a,.course-info-list a,.payload-content a{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--accent)}
.grade-label a:hover,.course-info-list a:hover,.payload-content a:hover{color:var(--accent);border-bottom-style:solid}
.course-info-list{list-style:none;margin:.2rem 0 0;padding:0}
.course-info-list li{display:block;margin:.45rem 0;color:var(--muted)}
.info-content,.payload-content{padding:.85rem 1.1rem 1rem;color:var(--muted);line-height:1.45;word-break:break-word}
/* theme toggle */
.theme-toggle{position:fixed;top:1rem;right:1rem;display:flex;gap:.45rem;z-index:20}
.theme-toggle-btn{width:auto;margin:0;padding:.45rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.theme-toggle-btn:hover{background:var(--surface-soft);color:var(--accent)}
/* grade header */
.letter-big{font-size:2.45rem;font-weight:800;margin-left:.6rem;vertical-align:middle}
.current-line{margin:.25rem 0 1rem}
.grade-hero{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin:.35rem 0 .75rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:14px;background:var(--surface-soft)}
.grade-hero-label{color:var(--muted);font-weight:650}
.grade-hero-percent{font-weight:800;color:var(--text)}
.attendance-alert{border:1px solid var(--pill-red-border);background:color-mix(in srgb,var(--pill-red-fill) 22%,var(--surface-soft));border-radius:14px;padding:.78rem .9rem;margin:.75rem 0 1rem;color:var(--pill-red-text)}
.attendance-alert-main{font-weight:900;font-size:1.02rem;letter-spacing:.01em}
.attendance-alert-policy{color:var(--pill-blue-text);margin-top:.22rem;font-size:.9rem;line-height:1.35}
/* dashboard */
.summary-dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65rem;margin:1rem 0 1.15rem}
.summary-card{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:.75rem .7rem;text-align:center;min-height:5.2rem;display:flex;flex-direction:column;justify-content:center;align-items:center}
.summary-label{font-size:.78rem;color:var(--muted);margin-bottom:.18rem}
.summary-main{font-size:1.45rem;font-weight:800;color:var(--text);line-height:1.1}
.summary-sub{font-size:.78rem;color:var(--muted);margin-top:.18rem}
.summary-card.complete{border-color:var(--pill-green-border)}.summary-card.incomplete{border-color:var(--pill-orange-border)}.summary-card.unattempted{border-color:var(--pill-red-border)}.summary-card.absences{border-color:var(--pill-red-border)}
.summary-card.complete .summary-main{color:var(--pill-green-text)}.summary-card.incomplete .summary-main{color:var(--pill-orange-text)}.summary-card.unattempted .summary-main{color:var(--pill-red-text)}.summary-card.absences .summary-main{color:var(--pill-red-text)}
/* collapsible sections */
.grade-section{margin-top:.9rem;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,var(--surface-soft));overflow:hidden}
.grade-section summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem .95rem;font-weight:700;color:var(--text);list-style:none}
.grade-section summary::-webkit-details-marker{display:none}
.grade-section summary::after{content:'▾';color:var(--accent);font-size:.95rem;transition:transform var(--speed)}
.grade-section[open] summary{border-bottom:1px solid var(--line)}
.section-count{margin-left:auto;margin-right:.4rem;color:var(--muted);font-size:.78rem;font-weight:600;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;padding:.08rem .45rem}
/* attendance */
.absence-dates{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 1rem 1rem;padding-left:1.15rem}
.absence-chip{min-width:auto;--fill:0%;--pill-fill-color:var(--pill-red-fill);--pill-text-color:var(--pill-red-text);--pill-border-color:var(--pill-red-border);font-size:.9rem;padding:.24rem .65rem}
.attendance-note{margin:.55rem 1rem 1rem;padding-left:1.15rem;color:var(--muted);font-size:.95rem}
@media (max-width:760px){.summary-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){body{padding:1rem}.card{padding:1.35rem}.summary-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grade-list li.grade-item{grid-template-columns:7.2rem 1.1rem minmax(0,1fr)}.grade-score{width:7rem}.status-pill,.score-token{min-width:6.9rem;font-size:.82rem}.absence-chip{font-size:.82rem}}
@media (max-width: 640px) {
  body {
    align-items: flex-start;
    padding-top: 6rem;
  }

  .theme-toggle,
  .theme-switch,
  .theme-control {
    top: .75rem;
    right: .75rem;
  }

  .card {
    margin-top: 0;
  }
}
  
</style>
</head>

<body>

<!-- theme switcher -->
<div class="theme-toggle">
 <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Switch to light mode">☀ Light mode</button>
</div>

<!-- LOGIN -->
<section id="login" class="card">
 <h1>Grade Viewer</h1>
 <form id="frm">
 <label>Class
 <select id="cls" required>
 <option value="" disabled selected>Choose…</option>
 <option>Logistics</option>
 <option>Trade</option>
 <option>Management Science</option>
 </select>
 </label>
 <label>Student ID <input id="sid" required></label>
 <label>Password   <input id="pw" type="password" required></label>
 <button type="submit">View Grades</button>
 </form>
 <p id="err" class="error"></p>
</section>

<!-- GRADES -->
<section id="grades" class="card" style="display:none;"></section>

<!-- PW dialog + overlay (unchanged) -->
<section id="pwCard" class="card" style="display:none;position:fixed;inset:0;margin:auto;max-width:26rem;z-index:50">
 <h2>Change Password</h2>
 <form id="pwForm">
 <label>Current Password <input id="oldPw" type="password" required></label>
 <label>New Password     <input id="newPw" type="password" required></label>
 <label>Confirm New      <input id="newPw2" type="password" required></label>
 <button type="submit">Save</button>
 <button type="button" id="cancelPw" style="margin-top:.5rem;background:var(--surface);color:var(--text)">Cancel</button>
 </form>
 <p id="pwMsg" class="error"></p>
</section>
<div id="overlay" style="display:none;position:fixed;inset:0;background:#0008;backdrop-filter:blur(2px)"></div>

<script>
const GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbzgm1I2e-zzru4e_mxG8LO7NBYvaW-_Fe04ZSwB7W6jIYSannMNHCYgt-fHKAcTBxAcRQ/exec';
const $=id=>document.getElementById(id);

/* theme switch */
const THEME_KEY = 'grade-viewer-theme';
function applyTheme(theme){
  const safeTheme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', safeTheme);
  const btn = $('themeToggle');
  if (btn) {
    btn.textContent = safeTheme === 'dark' ? '☀ Light mode' : '🌙 Dark mode';
    btn.setAttribute('aria-label', safeTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
$('themeToggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

/* grade helpers (no minus grades) */
const LADDER=["A+","A","B+","B","C+","C","D+","D","F"];
function letterFromPercent(p){
  if(p>=95)return"A+";if(p>=90)return"A";if(p>=85)return"B+";if(p>=80)return"B";
  if(p>=75)return"C+";if(p>=70)return"C";if(p>=65)return"D+";if(p>=60)return"D";return"F";}
function gradeColour(l){if(l==="F")return"#000";
  const i=LADDER.indexOf(l);const hue=220-i*(220/(LADDER.length-2));return`hsl(${hue},80%,55%)`;}
/*function pointsToNext(p){const r=(100-Math.floor(p))%5;return r===0?0:r;}*/
function escapeHtml(v){return String(v ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function hasValue(v){return v !== undefined && v !== null && String(v).trim() !== '';}
function hasCompletionTotals(t){return t && (hasValue(t.complete) || hasValue(t.effort) || hasValue(t.completeEffort) || hasValue(t.incomplete) || hasValue(t.unattempted));}
function categoryDisplayName(cat){
  const key = String(cat ?? '').trim().toLowerCase();
  if (key === 'assessments') return 'Assessments';
  if (key === 'assignments') return 'LMS Assignments';
  if (key === 'activities' || key === 'activites') return 'Class Activities';
  if (key === 'quiz') return 'Quizzes';
  if (key === 'exams') return 'Exams';
  return cat;
}
function isEffortBasedCategory(cat){
  const key = String(cat ?? '').trim().toLowerCase();
  return key === 'assignments' || key === 'activities' || key === 'activites';
}
function statusClass(value){
  const status = String(value ?? '').trim().toLowerCase();
  if (status === 'complete') return 'status-complete';
  if (status === 'effort') return 'status-effort';
  if (status === 'incomplete') return 'status-incomplete';
  if (status === 'unattempted') return 'status-unattempted';
  return '';
}
function numericValue(v){
  if (typeof v === 'number' && Number.isFinite(v)) return v;
  const text = String(v ?? '').trim();
  if (!text) return null;
  const match = text.match(/-?\d+(?:\.\d+)?/);
  if (!match) return null;
  const n = Number(match[0]);
  return Number.isFinite(n) ? n : null;
}
function scoreFillPercent(score, total){
  const s = numericValue(score);
  const t = numericValue(total);
  if (s === null || t === null || t <= 0) return 0;
  return Math.max(0, Math.min(100, (s / t) * 100));
}
function renderScoreValue(cat, item){
  if (isEffortBasedCategory(cat)) {
    const score = item.score ?? '';
    const cls = statusClass(score);
    if (cls) return `<span class="status-pill ${cls}">${escapeHtml(score)}</span>`;
    return `<span class="score-token" style="--fill:0%">${escapeHtml(score || '—')}</span>`;
  }
  const score = item.score ?? 0;
  const total = item.total ?? 0;
  const fill = scoreFillPercent(score, total).toFixed(2);
  return `<span class="score-token" style="--fill:${fill}%">${escapeHtml(score)}/${escapeHtml(total)}</span>`;
}
function completionNumber(t, key){
  return t && hasValue(t[key]) ? t[key] : '—';
}
function toNumberOrNull(v){
  if (!hasValue(v)) return null;
  const n = Number(String(v).replace('%','').trim());
  return Number.isFinite(n) ? n : null;
}
function completeEffortTotal(t){
  if (!t) return '—';
  if (hasValue(t.completeEffort)) return t.completeEffort;
  const complete = toNumberOrNull(t.complete);
  const effort = toNumberOrNull(t.effort);
  if (complete !== null && effort !== null) return complete + effort;
  if (complete !== null) return complete;
  return '—';
}
function findCategoryScore(d, categoryName){
  const cats = d && d.categories ? d.categories : {};
  const key = String(categoryName).trim().toLowerCase();
  for (const [cat, items] of Object.entries(cats)) {
    if (String(cat).trim().toLowerCase() !== key) continue;
    const first = Array.isArray(items) ? items[0] : null;
    if (first && hasValue(first.score)) return first.score;
  }
  return '';
}
function absenceCount(d){
  if (hasValue(d.totalAbsences)) return d.totalAbsences;
  const fromCategory = findCategoryScore(d, 'Absences');
  if (hasValue(fromCategory)) return fromCategory;
  return Array.isArray(d.absenceDates) ? d.absenceDates.length : '—';
}
function rawAttendancePenalty(d){
  const keys = ['attendancePenalty','attendancePenaltyPercent','absencePenalty','absencePenaltyPercent','attendancePenaltyApplied'];
  for (const key of keys) if (hasValue(d[key])) return d[key];
  return '';
}
function formatPenaltyValue(v){
  if (!hasValue(v)) return '';
  const n = toNumberOrNull(v);
  if (n === null) return String(v).trim();
  if (n === 0) return '0%';
  const abs = Math.abs(n);
  return `-${Number.isInteger(abs) ? abs : abs.toFixed(1).replace(/\.0$/,'')}%`;
}
function renderAttendancePenaltyAlert(d){
  const penalty = formatPenaltyValue(rawAttendancePenalty(d));
  if (!penalty || penalty === '0%') return '';
  return `<div class="attendance-alert" role="status">
    <div class="attendance-alert-main">${escapeHtml(penalty)} attendance penalty applied! 🤡</div>
    <div class="attendance-alert-policy">First 5 absences have no penalty. Absences 6–10 are -2% each.</div>
  </div>`;
}
function safeHref(url){
  const text = String(url || '').trim();
  if (!/^https?:\/\//i.test(text)) return '';
  return escapeHtml(text);
}
function renderItemLabel(o){
  const label = escapeHtml(o.label || 'Untitled');
  const href = safeHref(o.link);
  if (!href) return label;
  return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}
function formatPayload(payload){
  const text = String(payload || '').trim();
  if (!text) return '';
  if (/^https?:\/\//i.test(text)) {
    return `<p><a href="${escapeHtml(text)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a></p>`;
  }
  return `<p>${escapeHtml(text).replace(/\n/g, '<br>')}</p>`;
}
function renderCourseInfoSection(){
  return `<details class="grade-section course-info-section">
    <summary><span>Course Information</span></summary>
    <div class="info-content">
      <ul class="course-info-list">
        <li>Here is where you will find important information for this course. Start with the reading the following:</li>
        <li>Updated frequently - <a href="https://docs.google.com/document/d/1UbmMfzJcsf7v5y3UDxDd-lyvO-XWEdF87Zkp-me1UwY/edit?usp=sharing" target="_blank" rel="noopener noreferrer">README</a></li>
        <li><a href="https://docs.google.com/spreadsheets/d/15GWtJZ86RjD5ofLIUkzvy1g0tihkuZyLIM9ycnPKYjo/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Effort-based Rubric</a></li>
      </ul>
    </div>
  </details>`;
}
function renderPayloadSection(payload){
  if (!hasValue(payload)) return '';
  return `<details class="grade-section payload-section" open>
    <summary><span>Student Information</span></summary>
    <div class="payload-content">${formatPayload(payload)}</div>
  </details>`;
}
function orderedCategoryNames(categories){
  const order = ['Assessments','Assignments','Activities','Attendance','Absences','Project','Extra Points','Quiz','Exams'];
  const keys = Object.keys(categories || {});
  return [
    ...order.filter(cat => keys.includes(cat)),
    ...keys.filter(cat => !order.includes(cat))
  ];
}
function renderCurrentGrade(pct, letter){
  return `<div class="grade-hero" aria-label="Current grade">
    <span class="grade-hero-label">Current Grade</span>
    <span class="grade-hero-percent">${pct.toFixed(1)}%</span>
    <span class="letter-big" style="color:${gradeColour(letter)}">${escapeHtml(letter)}</span>
  </div>`;
}
function renderDashboardCard(label, value, cls, sub=''){
  return `<div class="summary-card ${cls || ''}">
    <span class="summary-label">${escapeHtml(label)}</span>
    <span class="summary-main">${escapeHtml(value)}</span>
    ${sub ? `<span class="summary-sub">${escapeHtml(sub)}</span>` : ''}
  </div>`;
}
function renderSummaryDashboard(d){
  const t = d.completionTotals || {};
  return `<section class="summary-dashboard" aria-label="Grade summary">
    ${renderDashboardCard('Complete + Effort', completeEffortTotal(t), 'complete')}
    ${renderDashboardCard('Incomplete', completionNumber(t, 'incomplete'), 'incomplete')}
    ${renderDashboardCard('Unattempted', completionNumber(t, 'unattempted'), 'unattempted')}
    ${renderDashboardCard('Absences', absenceCount(d), 'absences')}
  </section>`;
}
function shouldSectionStartOpen(cat, d){
  return true;
}

/* LOGIN */
$('frm').addEventListener('submit',async e=>{
  e.preventDefault();$('err').textContent='Checking…';
  const cls=$('cls').value,id=$('sid').value.trim(),pw=$('pw').value;
  try{
    const res=await fetch(`${GAS_ENDPOINT}?${new URLSearchParams({class:cls,id,pw,tab:'Totals'})}`);
    const js=await res.json();if(js.status!=='ok')throw new Error(js.message);
    window._login={cls,id,pw};render(js.data);
  }catch(err){$('err').textContent=err.message||err;}
});

/* RENDER */
function render(d){
  $('login').style.display = 'none';
  $('grades').style.display = 'block';

  const pct     = +d.currentPercent;
  const letter  = d.letterGrade || letterFromPercent(pct);
  /*
  const need    = pointsToNext(pct);
  const showMsg = letter !== 'A+' && need > 0;           // ⇦ NEW

  const nextLetter = showMsg ? letterFromPercent(pct + need) : '';

   ${showMsg ? `<p class="points-msg sparkle">
        Need <b>${need}</b> pt to reach <b>${nextLetter}</b>!
      </p>` : ''}
      
  <p><b>Current Points:</b> ${d.currentAvailablePoints.student}/${d.currentAvailablePoints.max}</p>
  <p><b>Max Possible Points:</b> ${d.maxPossiblePoints}</p>
  */
  const g = $('grades');
  g.innerHTML = `
    <div class="student-header">
      <h2>Hello, ${escapeHtml(d.name || 'Student')}</h2>
      <button id="openPw" class="password-link" type="button">Change Password</button>
    </div>

    ${renderCurrentGrade(pct, letter)}
    ${renderAttendancePenaltyAlert(d)}
    ${renderSummaryDashboard(d)}
    ${renderCourseInfoSection()}
    ${renderPayloadSection(d.payload)}

    <hr>`;

  /* grade list */
  for (const cat of orderedCategoryNames(d.categories)) {
    const items = d.categories[cat];
    const safeId = `ul-${cat}`.replace(/[^a-z0-9_-]/gi, '-');
    const isOpen = shouldSectionStartOpen(cat, d) ? ' open' : '';
    g.insertAdjacentHTML('beforeend', `
      <details class="grade-section"${isOpen}>
        <summary>
          <span>${escapeHtml(categoryDisplayName(cat))}</span>
          <span class="section-count">${items.length}</span>
        </summary>
        <ul id="${safeId}" class="grade-list"></ul>
      </details>`);
    const ul = $(safeId);
    items.forEach(o => ul.insertAdjacentHTML('beforeend',
      `<li class="grade-item">
        <span class="grade-score">${renderScoreValue(cat, o)}</span>
        <span class="grade-arrow">←</span>
        <span class="grade-label">${renderItemLabel(o)}</span>
      </li>`));

    if (/^Attendance$/i.test(cat)) {
      renderAbsenceDates(ul.closest('details') || g, d.absenceDates, d.absenceDatesError);
    }
  }
  $('openPw').onclick = () => { $('overlay').style.display = $('pwCard').style.display = 'block'; };

}


function renderAbsenceDates(container, dates, error) {
  if (error) {
    container.insertAdjacentHTML('beforeend',
      `<p class="attendance-note">Absence dates could not be loaded: ${escapeHtml(error)}</p>`);
    return;
  }

  if (!Array.isArray(dates) || dates.length === 0) {
    container.insertAdjacentHTML('beforeend',
      `<p class="attendance-note"><b>Absence Dates:</b> No recorded absences.</p>`);
    return;
  }

  container.insertAdjacentHTML('beforeend', `
    <p class="attendance-note"><b>Absence Dates:</b></p>
    <div class="absence-dates">
      ${dates.map(date => `<span class="absence-chip">${escapeHtml(date)}</span>`).join('')}
    </div>
  `);
}

/* PW change (unchanged) */
$('cancelPw').onclick=()=>{$('overlay').style.display=$('pwCard').style.display='none';$('pwMsg').textContent='';$('pwForm').reset();};
$('pwForm').addEventListener('submit',async e=>{
  e.preventDefault();const oldPw=$('oldPw').value,new1=$('newPw').value,new2=$('newPw2').value;
  if(new1!==new2){$('pwMsg').textContent='New passwords do not match.';return;}
  $('pwMsg').textContent='Updating…';
  const body=new URLSearchParams({action:'changePw',class:_login.cls,id:_login.id,oldPw,newPw:new1,tab:'Totals'});
  try{
    const r=await fetch(GAS_ENDPOINT,{method:'POST',body});const js=await r.json();
    if(js.status!=='ok')throw new Error(js.message);
    $('pwMsg').style.color='var(--accent)';$('pwMsg').textContent='Password updated!';_login.pw=new1;
    setTimeout(()=>$('cancelPw').click(),1200);
  }catch(err){$('pwMsg').style.color='#e11d48';$('pwMsg').textContent=err.message||err;}
});
</script>
</body>
