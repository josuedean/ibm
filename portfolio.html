<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Portfolio Website — Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ─── Design Tokens ─────────────────────────────────────── */
    :root {
      --bg:           #f5f2ec;
      --bg-card:      #ffffff;
      --bg-surface:   #ede9e0;
      --border:       #d4cfc4;
      --border-light: #e8e3d8;
      --ink:          #1a1814;
      --ink-mid:      #4a453e;
      --ink-dim:      #8c857a;
      --accent:       #c0392b;
      --accent-warm:  #d45a2a;
      --accent-cool:  #2e6da4;
      --good:         #1a6b43;
      --good-bg:      rgba(26,107,67,0.07);
      --good-border:  rgba(26,107,67,0.25);
      --bad:          #b02020;
      --bad-bg:       rgba(176,32,32,0.06);
      --bad-border:   rgba(176,32,32,0.22);
      --radius:       3px;
      --radius-md:    6px;
    }

    [data-theme="dark"] {
      --bg:           #141210;
      --bg-card:      #1e1c19;
      --bg-surface:   #252220;
      --border:       #3a3630;
      --border-light: #2e2b27;
      --ink:          #f0ece4;
      --ink-mid:      #b5afa6;
      --ink-dim:      #6e6760;
      --accent:       #e05a4a;
      --accent-warm:  #e07040;
      --accent-cool:  #5a9fd4;
      --good:         #4daa78;
      --good-bg:      rgba(77,170,120,0.09);
      --good-border:  rgba(77,170,120,0.28);
      --bad:          #e05a4a;
      --bad-bg:       rgba(224,90,74,0.08);
      --bad-border:   rgba(224,90,74,0.28);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      line-height: 1.65;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ─── Sticky Nav ────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 2px solid var(--ink);
      padding: 0 2rem;
      transition: background 0.3s, border-color 0.3s;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: var(--ink);
      text-decoration: none;
      padding: 0.9rem 1.4rem 0.9rem 0;
      margin-right: 1rem;
      border-right: 1px solid var(--border);
      white-space: nowrap;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    nav a.nav-link {
      color: var(--ink-dim);
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.9rem 1rem;
      white-space: nowrap;
      transition: color 0.15s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      display: flex;
      align-items: center;
    }
    nav a.nav-link:hover { color: var(--ink); border-bottom-color: var(--accent); }
    nav a.nav-link.active { color: var(--accent); border-bottom-color: var(--accent); }

    .nav-spacer { flex: 1; }

    /* Theme toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0 0 1rem;
      border-left: 1px solid var(--border);
      margin-left: 0.5rem;
      flex-shrink: 0;
      cursor: pointer;
      background: none;
      border-right: none;
      border-top: none;
      border-bottom: 3px solid transparent;
    }
    .theme-toggle:hover .toggle-track { background: var(--ink-dim); }

    .toggle-track {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: var(--border);
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 0.2s, background 0.2s;
    }
    [data-theme="dark"] .toggle-thumb { transform: translateX(16px); }

    .toggle-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    /* ─── Layout ────────────────────────────────────────────── */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 8rem;
    }

    /* ─── Hero ──────────────────────────────────────────────── */
    .hero {
      padding: 5rem 0 4rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: end;
    }

    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; gap: 2rem; }
    }

    .hero-left {
      opacity: 0;
      animation: fadeIn 0.7s 0.1s forwards;
    }

    .hero-eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 2px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3rem, 6vw, 5.2rem);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-right {
      opacity: 0;
      animation: fadeIn 0.7s 0.35s forwards;
    }

    .principle-block {
      padding: 2rem;
      border: 1px solid var(--ink);
      position: relative;
    }
    .principle-block::before {
      content: '✦';
      position: absolute;
      top: -0.65rem;
      left: 1.5rem;
      background: var(--bg);
      padding: 0 0.4rem;
      font-size: 0.75rem;
      color: var(--accent);
      line-height: 1;
      transition: background 0.3s;
    }

    .principle-block .p-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 0.8rem;
    }

    .principle-block blockquote {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
    }

    /* ─── Section Styles ────────────────────────────────────── */
    .section {
      margin-bottom: 5rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s, transform 0.55s;
    }
    .section.visible { opacity: 1; transform: none; }

    .section-header {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--ink);
    }

    .section-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      line-height: 1;
      padding-top: 0.1rem;
    }

    .section-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .prose {
      color: var(--ink-mid);
      font-size: 1rem;
      line-height: 1.75;
      max-width: 720px;
    }
    .prose + .prose { margin-top: 0.9rem; }
    .prose strong { color: var(--ink); font-weight: 600; }

    /* ─── Inline list (beneath prose) ──────────────────────── */
    .prose-list {
      list-style: none;
      padding: 0;
      margin: 1.2rem 0 0 0;
      max-width: 720px;
      border-top: 1px solid var(--border-light);
    }
    .prose-list li {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.95rem;
      color: var(--ink-mid);
      line-height: 1.6;
    }
    .prose-list li::before {
      content: '—';
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
    }
    .prose-list li strong { color: var(--ink); font-weight: 600; }

    /* ─── Requirement Cards (section 02 & 06) ───────────────── */
    .req-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      border: 1px solid var(--border);
      margin-top: 0;
      background: var(--border);
    }

    .req-card {
      background: var(--bg-card);
      padding: 1.8rem;
      transition: background 0.15s;
    }
    .req-card:hover { background: var(--bg-surface); }

    .req-card-icon {
      font-size: 0.72rem;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-cool);
      margin-bottom: 0.8rem;
    }

    .req-card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 0.6rem;
      line-height: 1.2;
    }

    .req-card p {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.7;
    }
    .req-card p strong { color: var(--ink); font-weight: 600; }

    .req-card ul {
      list-style: none;
      padding: 0;
      margin-top: 0.4rem;
    }
    .req-card ul li {
      font-size: 0.87rem;
      color: var(--ink-mid);
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .req-card ul li:last-child { border-bottom: none; }
    .req-card ul li::before {
      content: '·';
      color: var(--accent-cool);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ─── Callout ───────────────────────────────────────────── */
    .callout {
      border: 1px solid var(--border);
      border-left: 3px solid var(--ink);
      padding: 1.2rem 1.6rem;
      font-size: 0.9rem;
      color: var(--ink-mid);
      margin: 1.8rem 0;
      background: var(--bg-surface);
    }
    .callout strong { color: var(--ink); font-weight: 600; }
    .callout em { color: var(--ink-dim); }

    /* ─── Website Structure Cards ───────────────────────────── */
    .structure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .struct-card {
      background: var(--bg-card);
      padding: 1.8rem;
      transition: background 0.15s;
    }
    .struct-card:hover { background: var(--bg-surface); }

    .struct-card-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 2rem;
      font-weight: 400;
      color: var(--border);
      line-height: 1;
      margin-bottom: 0.6rem;
      transition: color 0.2s;
    }
    .struct-card:hover .struct-card-num { color: var(--ink-dim); }

    .struct-card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 0.6rem;
    }

    .struct-card p {
      font-size: 0.86rem;
      color: var(--ink-mid);
      line-height: 1.65;
      margin-bottom: 0.5rem;
    }

    .struct-card ul {
      list-style: none;
      padding: 0;
    }
    .struct-card ul li {
      font-size: 0.84rem;
      color: var(--ink-mid);
      padding: 0.25rem 0;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .struct-card ul li:last-child { border-bottom: none; }
    .struct-card ul li::before {
      content: '·';
      color: var(--ink-dim);
      flex-shrink: 0;
    }

    /* ─── Project Page Steps ────────────────────────────────── */
    .steps { display: flex; flex-direction: column; gap: 0; }

    .step {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 0;
      border: 1px solid var(--border);
      border-bottom: none;
      transition: background 0.15s;
    }
    .step:last-child { border-bottom: 1px solid var(--border); }
    .step:hover { background: var(--bg-surface); }

    .step-num {
      font-family: 'DM Serif Display', serif;
      font-size: 2.6rem;
      font-style: italic;
      font-weight: 400;
      color: var(--border);
      line-height: 1;
      padding: 1.5rem 0 1.5rem 1.5rem;
      border-right: 1px solid var(--border);
      align-self: stretch;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 0;
      transition: color 0.2s;
    }
    .step:hover .step-num { color: var(--ink-dim); }

    .step-body {
      padding: 1.5rem 1.8rem;
    }

    .step-body h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .step-body p {
      font-size: 0.9rem;
      color: var(--ink-mid);
      margin-bottom: 0.6rem;
      line-height: 1.7;
    }
    .step-body p strong { color: var(--ink); font-weight: 600; }

    .step-body ul {
      list-style: none;
      padding: 0;
      margin-top: 0.4rem;
    }
    .step-body ul li {
      font-size: 0.875rem;
      color: var(--ink-mid);
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .step-body ul li:last-child { border-bottom: none; }
    .step-body ul li::before {
      content: '—';
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: var(--ink-dim);
      flex-shrink: 0;
    }
    .step-body ul li strong { color: var(--ink); font-weight: 600; }

    /* ─── Tag list ──────────────────────────────────────────── */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.7rem;
    }
    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--accent-cool);
      color: var(--accent-cool);
      background: transparent;
      border-radius: 2px;
    }

    /* ─── Evidence Columns ──────────────────────────────────── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-top: 1.5rem;
    }
    @media (max-width: 620px) { .two-col { grid-template-columns: 1fr; } }

    .check-block {
      padding: 1.6rem;
      background: var(--bg-card);
    }
    .check-block.good { border-top: 3px solid var(--good); }
    .check-block.bad  { border-top: 3px solid var(--bad); }

    .block-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    .check-block.good .block-label { color: var(--good); }
    .check-block.bad  .block-label { color: var(--bad); }

    .check-block ul {
      list-style: none;
      padding: 0;
    }
    .check-block ul li {
      font-size: 0.875rem;
      color: var(--ink-mid);
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      line-height: 1.5;
    }
    .check-block ul li:last-child { border-bottom: none; }
    .check-block ul li::before { flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; margin-top: 0.05rem; }
    .check-block.good ul li::before { content: '✓'; color: var(--good); font-weight: 700; }
    .check-block.bad  ul li::before { content: '✕'; color: var(--bad); font-weight: 700; }

    /* ─── Tech Block ────────────────────────────────────────── */
    .req-block {
      border: 1px solid var(--border);
      padding: 1.8rem;
      margin-top: 1px;
      background: var(--bg-card);
    }

    .req-block h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .req-block h4 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-cool);
      margin: 1.2rem 0 0.6rem;
    }

    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tech-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--border);
      color: var(--ink-mid);
      background: var(--bg-surface);
      border-radius: 2px;
      transition: border-color 0.15s, color 0.15s;
    }
    .tech-pill:hover { border-color: var(--ink); color: var(--ink); }

    /* ─── Closing Banner ────────────────────────────────────── */
    .closing-banner {
      margin-top: 6rem;
      padding: 5rem 3rem;
      border: 2px solid var(--ink);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .closing-banner::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--border);
      pointer-events: none;
    }

    .closing-banner h2 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 1rem;
      position: relative;
    }
    .closing-banner h2 em { font-style: italic; color: var(--accent); }

    .closing-banner p {
      font-size: 1rem;
      color: var(--ink-mid);
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ─── Animations ────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ─── Responsive ────────────────────────────────────────── */
    @media (max-width: 700px) {
      .page-wrapper { padding: 0 1.2rem 4rem; }
      .hero { padding: 3rem 0 2.5rem; }
      .req-grid { grid-template-columns: 1fr; }
      .structure-grid { grid-template-columns: 1fr; }
      .step { grid-template-columns: 44px 1fr; }
      nav a.nav-link { padding: 0.8rem 0.7rem; font-size: 0.68rem; }
      .closing-banner { padding: 3rem 1.5rem; }
    }
  </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────────────── -->
<nav>
  <div class="nav-inner">
    <a href="#" class="nav-brand">Portfolio</a>
    <a href="#purpose"       class="nav-link">Purpose</a>
    <a href="#requirements"  class="nav-link">Requirements</a>
    <a href="#structure"     class="nav-link">Structure</a>
    <a href="#project-pages" class="nav-link">Project Pages</a>
    <a href="#evidence"      class="nav-link">Evidence</a>
    <a href="#technical"     class="nav-link">Technical</a>
    <div class="nav-spacer"
